name: WIP one-shot Aemeath Chisa Echo presets

on:
  push:
    branches:
      - v4-ui-step-11-dps4

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'M4STER-3/wuwa-dps-calculator' && github.ref == 'refs/heads/v4-ui-step-11-dps4'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v4-ui-step-11-dps4
          fetch-depth: 1
          persist-credentials: true
      - name: Add reviewed pilot presets
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('src/data/community-echo-preset-registry.json')
          registry = json.loads(path.read_text(encoding='utf-8'))
          presets = registry['presets']
          existing = {preset['resonatorId'] for preset in presets}
          if 'aemeath' in existing or 'chisa' in existing:
              raise SystemExit('Aemeath or Chisa preset already exists; refusing duplicate projection')

          presets.extend([
            {
              'resonatorId': 'aemeath',
              'name': 'Standard CD Build',
              'author': 'lavasnake',
              'sourceBlobSha': 'bee680c2300dbddaccf93191206710fb05f1489d',
              'promotionStatus': 'verified',
              'echoes': [
                {'cost':4,'echo':'Sigillum','sonata':'TrailblazingStar','mainStat':'CritDMG','substats':[['CritRate',8.1],['CritDMG',16.2],['ATK',8.6],['ATK_FLAT',50],['ResonanceLiberationDMGBonus',8.6]]},
                {'cost':3,'echo':'Glommoth','sonata':'TrailblazingStar','mainStat':'Fusion','substats':[['CritRate',8.1],['CritDMG',16.2],['ATK',8.6],['ATK_FLAT',50],['ResonanceLiberationDMGBonus',8.6]]},
                {'cost':3,'echo':'Kronablight','sonata':'TrailblazingStar','mainStat':'Fusion','substats':[['CritRate',8.1],['CritDMG',16.2],['EnergyRegen',9.2],['DEF',10.9],['HP',8.6]]},
                {'cost':1,'echo':'GeospiderS4','sonata':'TrailblazingStar','mainStat':'ATK','substats':[['CritRate',8.1],['CritDMG',16.2],['EnergyRegen',9.2],['DEF',10.9],['HP',8.6]]},
                {'cost':1,'echo':'IceglintDancer','sonata':'TrailblazingStar','mainStat':'ATK','substats':[['CritRate',8.1],['CritDMG',16.2],['HP',8.6],['HP_FLAT',430],['DEF',10.9]]},
              ],
              'mainEcho': 'Sigillum',
            },
            {
              'resonatorId': 'chisa',
              'name': 'WUWA LAB Balanced · Thread of Severed Fate + Havoc Eclipse',
              'author': 'WUWA LAB · thundertooth-guided',
              'sourceBlobSha': 'eec636f68ab1d0af52a7635a18f3ba633aed0654',
              'promotionStatus': 'curated-balanced',
              'promotionNote': 'Based on thundertooth Standard CR Thread of Severed Fate + Havoc Eclipse. Legacy impossible HP_FLAT=50 entries are replaced only with the legal reviewed HP_FLAT=320 roll; all other sourced main/substats are preserved.',
              'echoes': [
                {'cost':4,'echo':'ReminiscenceThrenodianLeviathan','sonata':'ThreadofSeveredFate','mainStat':'CritRate','substats':[['CritRate',8.1],['CritDMG',16.2],['ATK',8.6],['ATK_FLAT',50],['ResonanceLiberationDMGBonus',8.6]]},
                {'cost':3,'echo':'AbyssalGladius','sonata':'ThreadofSeveredFate','mainStat':'Havoc','substats':[['CritRate',8.1],['CritDMG',16.2],['ATK',8.6],['ATK_FLAT',50],['ResonanceLiberationDMGBonus',8.6]]},
                {'cost':3,'echo':'NightmareRoseshroom','sonata':'ThreadofSeveredFate','mainStat':'Havoc','substats':[['CritRate',8.1],['CritDMG',16.2],['EnergyRegen',9.2],['DEF',10.9],['HP_FLAT',320]]},
                {'cost':1,'echo':'HavocWarrior','sonata':'HavocEclipse','mainStat':'ATK','substats':[['CritRate',8.1],['CritDMG',16.2],['EnergyRegen',9.2],['HP_FLAT',320],['DEF_FLAT',50]]},
                {'cost':1,'echo':'Chirpuff','sonata':'HavocEclipse','mainStat':'ATK','substats':[['CritRate',8.1],['CritDMG',16.2],['EnergyRegen',9.2],['HP_FLAT',320],['DEF',10.9]]},
              ],
              'mainEcho': 'ReminiscenceThrenodianLeviathan',
            },
          ])
          path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Validate and generate projection
        shell: bash
        run: node scripts/generate-character-box-community-echo-presets.mjs
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/wip-one-shot-preset-generation.yml
          git config user.name "WUWA LAB automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/community-echo-preset-registry.json src/generated/community-echo-presets-10r1.ts
          git diff --cached --check
          git commit -m "Add validated Aemeath and Chisa Echo presets"
          git push origin HEAD:v4-ui-step-11-dps4
