name: Encore GameDatabase readiness audit

on:
  workflow_dispatch:
  push:
    branches:
      - "audit/encore-readiness-release-20260817"
    paths:
      - ".github/encore-readiness.trigger"

permissions:
  contents: read

concurrency:
  group: encore-game-database-readiness-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Import, normalize, and measure Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify npm registry signatures and provenance
        run: npm audit signatures

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

      - name: Validate pipeline syntax
        run: |
          set -euo pipefail
          node --check scripts/lib/encore-client.mjs
          node --check scripts/lib/encore-normalizer.mjs
          node --check scripts/lib/game-database-readiness.mjs
          node --check scripts/import-wuwa-game-data.mjs
          node --check scripts/normalize-wuwa-game-data.mjs
          node --check scripts/analyze-wuwa-game-data-readiness.mjs

      - name: Run importer, normalizer, and readiness attack tests before network
        run: |
          set -euo pipefail
          npm run game-data:test-security
          npm run game-data:test-normalizer-security
          npm run game-data:test-readiness-security

      - name: Import live Encore Release into ephemeral runner storage
        run: npm run game-data:import

      - name: Normalize imported Release data
        run: npm run game-data:normalize

      - name: Measure normalized JSON node count and name controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/wuwa-game-data-readiness
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const root = JSON.parse(await readFile('.tmp/wuwa-game-data-normalized/normalized-source.json', 'utf8'));
          const stack = [{ value: root, category: 'root' }];
          let nodes = 0;
          const absoluteAuditCeiling = 5_000_000;
          const controlCounts = Object.create(null);
          const affectedNameCounts = Object.create(null);

          while (stack.length > 0) {
            const current = stack.pop();
            if (!current) continue;
            const { value, category } = current;
            nodes += 1;
            if (nodes > absoluteAuditCeiling) throw new Error(`Normalized JSON exceeded audit ceiling ${absoluteAuditCeiling}`);
            if (value === null || typeof value !== 'object') continue;

            if (Array.isArray(value)) {
              for (let index = value.length - 1; index >= 0; index -= 1) {
                stack.push({ value: value[index], category });
              }
              continue;
            }

            for (const [key, child] of Object.entries(value)) {
              const nextCategory = ['characters', 'weapons', 'echoes', 'sonataSets'].includes(key) ? key : category;
              if (key === 'name' && typeof child === 'string') {
                let affected = false;
                for (const char of child) {
                  const code = char.codePointAt(0);
                  if ((code >= 0x00 && code <= 0x1f) || (code >= 0x7f && code <= 0x9f)) {
                    affected = true;
                    const label = `U+${code.toString(16).toUpperCase().padStart(4, '0')}`;
                    controlCounts[nextCategory] ??= Object.create(null);
                    controlCounts[nextCategory][label] = (controlCounts[nextCategory][label] ?? 0) + 1;
                  }
                }
                if (affected) affectedNameCounts[nextCategory] = (affectedNameCounts[nextCategory] ?? 0) + 1;
              }
              stack.push({ value: child, category: nextCategory });
            }
          }

          const summary = {
            normalizedJsonNodes: nodes,
            controlCodepointOccurrencesByCategory: controlCounts,
            affectedNamesByCategory: affectedNameCounts,
          };
          await writeFile(
            '.tmp/wuwa-game-data-readiness/name-control-summary.json',
            `${JSON.stringify(summary, null, 2)}\n`,
            'utf8',
          );
          console.log(`WUWA_NORMALIZED_JSON_NODE_COUNT=${nodes}`);
          console.log(`WUWA_NORMALIZED_NAME_CONTROL_SUMMARY=${JSON.stringify(summary)}`);
          NODE

      - name: Audit current Release Echo cost and Sonata source semantics
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const root = 'data/sources/encore/release';
          const manifest = JSON.parse(await readFile(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest?.sourceProvider !== 'encore' || manifest?.dataset !== 'Release') {
            throw new Error('Unexpected raw snapshot provider/dataset.');
          }
          const entities = manifest?.resources?.echoes?.entities;
          if (!Array.isArray(entities) || entities.length === 0 || entities.length > 1000) {
            throw new Error('Unexpected Echo entity collection.');
          }

          const sha256 = (value) => createHash('sha256').update(String(value), 'utf8').digest('hex');
          const randGroups = Object.create(null);
          const rarityByRandGroup = Object.create(null);
          const qualityByRandGroup = Object.create(null);
          let missingRandGroupId = 0;
          let invalidRandGroupId = 0;
          let totalSonataRefs = 0;
          let refsWithoutStructuredGroup = 0;
          let structuredNamesWithoutDefinition = 0;
          let definitionNamesWithoutStructuredGroup = 0;
          const referencedIds = new Set();
          const structuredIds = new Set();
          const groupState = new Map();

          const addCount = (target, outer, inner) => {
            target[outer] ??= Object.create(null);
            target[outer][inner] = (target[outer][inner] ?? 0) + 1;
          };

          for (const entity of entities) {
            if (!entity || typeof entity.sourceId !== 'string' || !/^[a-f0-9]{32}\.json$/.test(entity.detailFile ?? '')) {
              throw new Error('Invalid Echo manifest entity metadata.');
            }
            const detail = JSON.parse(
              await readFile(path.join(root, 'echoes', 'details', entity.detailFile), 'utf8'),
            );
            if (String(detail.MonsterId) !== entity.sourceId) throw new Error('Echo detail ID mismatch.');

            const randGroupId = detail?.MainProp?.RandGroupId;
            if (randGroupId === null || randGroupId === undefined || randGroupId === '') {
              missingRandGroupId += 1;
            } else if (!Number.isInteger(randGroupId)) {
              invalidRandGroupId += 1;
            } else {
              const key = String(randGroupId);
              randGroups[key] = (randGroups[key] ?? 0) + 1;
              addCount(rarityByRandGroup, key, String(detail.Rarity));
              addCount(qualityByRandGroup, key, String(detail.QualityId));
            }

            const refs = Array.isArray(detail.FetterGroup) ? detail.FetterGroup : [];
            const refSet = new Set();
            for (const rawId of refs) {
              if (!Number.isInteger(rawId) || rawId <= 0 || rawId > 10000) throw new Error('Invalid Echo Sonata reference ID.');
              const id = String(rawId);
              refSet.add(id);
              referencedIds.add(id);
              totalSonataRefs += 1;
            }

            const structured = Array.isArray(detail.FetterGroupDetails) ? detail.FetterGroupDetails : [];
            const structuredSet = new Set();
            const structuredNameHashes = new Set();
            for (const rawEntry of structured) {
              const group = rawEntry?.Group;
              if (!group || !Number.isInteger(group.Id) || group.Id <= 0 || group.Id > 10000) continue;
              const id = String(group.Id);
              structuredSet.add(id);
              structuredIds.add(id);
              if (typeof group.FetterGroupName !== 'string' || group.FetterGroupName.length === 0) {
                throw new Error('Structured Sonata group is missing its source name.');
              }
              const nameHash = sha256(group.FetterGroupName);
              structuredNameHashes.add(nameHash);
              const map = Array.isArray(group.FetterMap)
                ? group.FetterMap.map((entry) => ({ Key: entry?.Key, Value: entry?.Value }))
                : [];
              const mapHash = sha256(JSON.stringify(map));
              const state = groupState.get(id) ?? {
                structuredOccurrences: 0,
                referenceOccurrences: 0,
                nameHashes: new Set(),
                mapHashes: new Set(),
              };
              state.structuredOccurrences += 1;
              state.nameHashes.add(nameHash);
              state.mapHashes.add(mapHash);
              groupState.set(id, state);
            }

            for (const id of refSet) {
              const state = groupState.get(id) ?? {
                structuredOccurrences: 0,
                referenceOccurrences: 0,
                nameHashes: new Set(),
                mapHashes: new Set(),
              };
              state.referenceOccurrences += 1;
              groupState.set(id, state);
              if (!structuredSet.has(id)) refsWithoutStructuredGroup += 1;
            }

            const definitionKeys = detail.FetterDetails && typeof detail.FetterDetails === 'object' && !Array.isArray(detail.FetterDetails)
              ? Object.keys(detail.FetterDetails)
              : [];
            const definitionNameHashes = new Set(definitionKeys.map(sha256));
            for (const hash of structuredNameHashes) {
              if (!definitionNameHashes.has(hash)) structuredNamesWithoutDefinition += 1;
            }
            for (const hash of definitionNameHashes) {
              if (!structuredNameHashes.has(hash)) definitionNamesWithoutStructuredGroup += 1;
            }
          }

          const groups = [...groupState.entries()]
            .sort(([a], [b]) => Number(a) - Number(b))
            .map(([groupId, state]) => ({
              groupId: Number(groupId),
              structuredOccurrences: state.structuredOccurrences,
              referenceOccurrences: state.referenceOccurrences,
              nameVariantCount: state.nameHashes.size,
              fetterMapVariantCount: state.mapHashes.size,
            }));

          const summary = {
            echoCount: entities.length,
            mainPropRandGroupIds: Object.fromEntries(Object.entries(randGroups).sort(([a], [b]) => Number(a) - Number(b))),
            missingMainPropRandGroupId: missingRandGroupId,
            invalidMainPropRandGroupId: invalidRandGroupId,
            rarityByRandGroup,
            qualityByRandGroup,
            sonata: {
              totalSourceReferences: totalSonataRefs,
              distinctReferencedGroupIds: [...referencedIds].map(Number).sort((a, b) => a - b),
              distinctStructuredGroupIds: [...structuredIds].map(Number).sort((a, b) => a - b),
              groups,
              refsWithoutStructuredGroup,
              structuredNamesWithoutDefinition,
              definitionNamesWithoutStructuredGroup,
            },
          };
          await writeFile(
            '.tmp/wuwa-game-data-readiness/echo-semantics-summary.json',
            `${JSON.stringify(summary, null, 2)}\n`,
            'utf8',
          );
          console.log(`WUWA_ECHO_SEMANTICS_SUMMARY=${JSON.stringify(summary)}`);
          NODE

      - name: Temporarily patch readiness limits for measurement run only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const file = 'scripts/lib/game-database-readiness.mjs';
          let source = await readFile(file, 'utf8');
          const nodeNeedle = 'const MAX_NODES = 250_000;';
          const nameNeedle = 'if (/[\\u0000-\\u001f\\u007f-\\u009f]/.test(value)) fail(`${label} contains control characters`);';
          if (!source.includes(nodeNeedle)) throw new Error('Expected readiness node limit not found.');
          if (!source.includes(nameNeedle)) throw new Error('Expected readiness name control rule not found.');
          source = source.replace(nodeNeedle, 'const MAX_NODES = 500_000;');
          source = source.replace(
            nameNeedle,
            'if (/[\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f-\\u009f]/.test(value)) fail(`${label} contains control characters`);',
          );
          await writeFile(file, source, 'utf8');
          NODE

      - name: Generate GameDatabase readiness report
        run: npm run game-data:readiness

      - name: Validate summaries contain no raw payloads
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const readiness = JSON.parse(await readFile('.tmp/wuwa-game-data-readiness/readiness.json', 'utf8'));
          const allowedTopLevel = new Set(['schemaVersion', 'source', 'readiness', 'observed', 'blockers']);
          for (const key of Object.keys(readiness)) {
            if (!allowedTopLevel.has(key)) throw new Error(`Unexpected readiness report key: ${key}`);
          }
          for (const file of [
            '.tmp/wuwa-game-data-readiness/readiness.json',
            '.tmp/wuwa-game-data-readiness/name-control-summary.json',
            '.tmp/wuwa-game-data-readiness/echo-semantics-summary.json',
          ]) {
            const serialized = await readFile(file, 'utf8');
            if (Buffer.byteLength(serialized) > 1024 * 1024) throw new Error(`${file} exceeded 1 MiB`);
            for (const forbidden of ['characters":[' , 'weapons":[', 'echoes":[', 'sourceHashes', 'sourceUrl', '<script', 'http://', 'https://']) {
              if (serialized.includes(forbidden)) throw new Error(`${file} contains forbidden raw-data marker: ${forbidden}`);
            }
          }
          console.log('Readiness/name/Echo semantic artifacts are summary-only.');
          NODE

      - name: Upload summary-only audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encore-release-game-database-readiness
          path: |
            .tmp/wuwa-game-data-readiness/readiness.json
            .tmp/wuwa-game-data-readiness/name-control-summary.json
            .tmp/wuwa-game-data-readiness/echo-semantics-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
