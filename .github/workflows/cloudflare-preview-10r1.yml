name: Cloudflare preview 10R1

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-preview-10r1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-10r1
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy isolated 10R1 preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Require Cloudflare preview credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare preview credentials are not configured in GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Write isolated preview config
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.preview.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "wuwa-dps-calculator-v4-step-10r1-preview",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-08-16",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            },
            "services": [
              {
                "binding": "WORKER_SELF_REFERENCE",
                "service": "wuwa-dps-calculator-v4-step-10r1-preview"
              }
            ]
          }
          EOF

      - name: Deploy isolated Cloudflare preview
        run: npx wrangler deploy --config wrangler.preview.jsonc
