name: Generated GameDatabase V1 live audit

on:
  push:
    branches:
      - audit/generated-game-database-v1-live-20260817

permissions:
  contents: read

concurrency:
  group: generated-game-database-live-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verify live Encore to GameDatabase V1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify dependency signatures and vulnerabilities
        run: |
          set -euo pipefail
          npm audit signatures
          npm audit --audit-level=high

      - name: Re-run hostile-input boundaries before network access
        run: |
          set -euo pipefail
          npm run game-data:test-security
          npm run game-data:test-normalizer-security
          npm run game-data:test-hardening-security
          npm run game-data:test-readiness-security

      - name: Import current Encore Release into ephemeral runner storage
        run: npm run game-data:import

      - name: Build reviewed GameDatabase V1 from live Release
        run: npm run game-data:build

      - name: Independently verify generated catalog and write summary only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/generated-game-database-live-audit
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, stat, writeFile } from 'node:fs/promises';

          const readJson = async (file, maxBytes) => {
            const info = await stat(file);
            if (!info.isFile() || info.size <= 0 || info.size > maxBytes) throw new Error(`Invalid audit input size for ${file}: ${info.size}`);
            const bytes = await readFile(file);
            return { bytes, value: JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes)) };
          };

          const { bytes: dbBytes, value: db } = await readJson('.tmp/wuwa-game-database-v1/game-database-v1.json', 32 * 1024 * 1024);
          const { value: generation } = await readJson('.tmp/wuwa-game-database-v1/generation-report.json', 1024 * 1024);
          const { value: readiness } = await readJson('.tmp/wuwa-game-data-readiness/readiness.json', 1024 * 1024);
          const { value: normalized } = await readJson('.tmp/wuwa-game-data-normalized/normalized-source.json', 32 * 1024 * 1024);

          if (db?.manifest?.schemaVersion !== 1 || db?.manifest?.dataset !== 'Release' || db?.manifest?.sourceProvider !== 'encore') {
            throw new Error('Generated manifest escaped reviewed Encore Release boundary.');
          }
          const families = ['characters', 'weapons', 'echoes', 'sonataSets'];
          for (const family of families) {
            if (!Array.isArray(db[family])) throw new Error(`Generated ${family} is not an array.`);
            if (db.manifest.counts?.[family] !== db[family].length) throw new Error(`Generated ${family} count mismatch.`);
            const canonical = new Set();
            const encore = new Set();
            for (const entity of db[family]) {
              if (typeof entity?.id !== 'string' || canonical.has(entity.id)) throw new Error(`Duplicate/invalid canonical ID in ${family}.`);
              canonical.add(entity.id);
              const encoreId = entity?.externalIds?.encore;
              if (typeof encoreId !== 'string' || encore.has(encoreId)) throw new Error(`Duplicate/invalid Encore ID in ${family}.`);
              encore.add(encoreId);
              if (entity?.source?.provider !== 'encore' || entity?.source?.dataset !== 'Release') throw new Error(`Invalid source metadata in ${family}.`);
              if (!/^[a-f0-9]{64}$/.test(String(entity?.source?.sourceHash ?? ''))) throw new Error(`Invalid source SHA-256 in ${family}.`);
            }
          }

          const sonataIds = new Set(db.sonataSets.map((entry) => entry.id));
          for (const echo of db.echoes) {
            if (![1, 3, 4].includes(echo.cost)) throw new Error(`Generated Echo ${echo.id} has invalid cost.`);
            if (!Array.isArray(echo.sonataSetIds)) throw new Error(`Generated Echo ${echo.id} lacks Sonata references.`);
            for (const sonataId of echo.sonataSetIds) {
              if (!sonataIds.has(sonataId)) throw new Error(`Generated Echo ${echo.id} references unknown Sonata ${sonataId}.`);
            }
          }

          const states = { base: 0, phantomSkin: 0, noncanonical: 0 };
          if (!Array.isArray(normalized?.echoes)) throw new Error('Normalized live Echo list missing.');
          for (const echo of normalized.echoes) {
            if (echo.catalogState === 'base') states.base += 1;
            else if (echo.catalogState === 'phantom-skin') states.phantomSkin += 1;
            else if (echo.catalogState === 'noncanonical') states.noncanonical += 1;
            else throw new Error('Live normalized Echo row lacks reviewed catalog state.');
          }
          if (states.base !== db.echoes.length) throw new Error(`Base Echo count ${states.base} does not match generated Echo count ${db.echoes.length}.`);
          if (states.base + states.phantomSkin + states.noncanonical !== normalized.echoes.length) throw new Error('Echo classification count mismatch.');

          const dangerousKeys = new Set(['__proto__', 'prototype', 'constructor']);
          const stack = [{ value: db, depth: 0 }];
          let nodes = 0;
          while (stack.length > 0) {
            const current = stack.pop();
            nodes += 1;
            if (nodes > 250_000) throw new Error('Generated database exceeds reviewed audit node budget.');
            if (current.depth > 32) throw new Error('Generated database exceeds reviewed audit depth.');
            const value = current.value;
            if (typeof value === 'string') {
              if (value.length > 100_000) throw new Error('Generated database contains oversized text.');
              if (/https?:\/\//i.test(value)) throw new Error('Generated database leaked an HTTP(S) URL.');
              if (/<\s*(?:script|iframe|object|embed)\b|javascript\s*:|data\s*:\s*text\/html|on[a-z]{2,}\s*=/i.test(value)) {
                throw new Error('Generated database contains script-like text.');
              }
              continue;
            }
            if (value === null || typeof value !== 'object') continue;
            if (Array.isArray(value)) {
              for (let index = value.length - 1; index >= 0; index -= 1) stack.push({ value: value[index], depth: current.depth + 1 });
              continue;
            }
            for (const [key, child] of Object.entries(value)) {
              if (dangerousKeys.has(key)) throw new Error(`Generated database contains dangerous key ${key}.`);
              if (/^(?:DamageList|Conditions?|Formula)$/i.test(key)) throw new Error(`Generated database leaked executable-looking source key ${key}.`);
              stack.push({ value: child, depth: current.depth + 1 });
            }
          }

          const blockerCodes = Array.isArray(readiness?.blockers) ? readiness.blockers.map((entry) => String(entry?.code ?? '')).filter(Boolean).sort() : [];
          const unresolved = Array.isArray(generation?.unresolved) ? generation.unresolved.map(String).sort() : [];
          const summary = {
            sourceCounts: normalized.counts,
            echoClassification: states,
            readinessEchoes: readiness?.readiness?.echoes,
            generatedCounts: db.manifest.counts,
            generatedBytes: dbBytes.length,
            generatedSha256: createHash('sha256').update(dbBytes).digest('hex'),
            generatedJsonNodes: nodes,
            blockerCodes,
            unresolved,
            checks: {
              uniqueCanonicalIds: true,
              uniqueEncoreIds: true,
              exactEchoSonataReferences: true,
              sourceHashesValid: true,
              inertTextScanPassed: true,
              dangerousKeyScanPassed: true
            }
          };
          const serialized = `${JSON.stringify(summary, null, 2)}\n`;
          if (Buffer.byteLength(serialized) > 128 * 1024) throw new Error('Audit summary unexpectedly large.');
          await writeFile('.tmp/generated-game-database-live-audit/summary.json', serialized, { flag: 'wx' });
          console.log(`WUWA_GENERATED_GAME_DATABASE_LIVE_AUDIT=${JSON.stringify(summary)}`);
          NODE

      - name: Upload summary-only audit artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-game-database-live-audit
          path: .tmp/generated-game-database-live-audit/summary.json
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
