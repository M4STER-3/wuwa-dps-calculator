name: GameDatabase promotion

on:
  push:
    branches:
      - 'game-data-promotion/**'

permissions:
  contents: read

concurrency:
  group: game-database-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sanitized GameDatabase from live Release
    if: github.event.head_commit.message == 'trigger game-data promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout promotion trigger without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify branch is exactly main plus the trigger
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == game-data-promotion/* ]]
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          parent_sha="$(git rev-parse HEAD^)"
          [[ "${parent_sha}" == "${main_sha}" ]]
          mapfile -t changed < <(git diff --name-only "${main_sha}" HEAD)
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == '.game-data-promotion-trigger' ]]
          [[ "$(cat .game-data-promotion-trigger)" == 'release' ]]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify dependencies and untrusted-data boundaries
        run: |
          set -euo pipefail
          npm audit signatures
          npm audit --audit-level=high
          npm run game-data:test-security
          npm run game-data:test-normalizer-security
          npm run game-data:test-hardening-security
          npm run game-data:test-readiness-security
          npm run game-data:test-promotion-security

      - name: Import current Encore Release into ephemeral storage
        run: npm run game-data:import

      - name: Build reviewed GameDatabase V1
        run: npm run game-data:build

      - name: Independently verify generated database
        run: node scripts/verify-generated-game-database.mjs --generated

      - name: Stage only sanitized database and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/game-database-promotion-artifact
          cp .tmp/wuwa-game-database-v1/game-database-v1.json .tmp/game-database-promotion-artifact/game-database-v1.json
          sha256sum .tmp/game-database-promotion-artifact/game-database-v1.json | awk '{print $1}' > .tmp/game-database-promotion-artifact/game-database-v1.sha256
          mapfile -t files < <(find .tmp/game-database-promotion-artifact -type f -printf '%f\n' | sort)
          expected=('game-database-v1.json' 'game-database-v1.sha256')
          [[ "${files[*]}" == "${expected[*]}" ]]

      - name: Upload sanitized promotion artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-database-promotion
          path: .tmp/game-database-promotion-artifact
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false

  promote:
    name: Commit verified database to promotion branch
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact promotion branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 2

      - name: Verify write job branch origin
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == game-data-promotion/* ]]
          [[ "$(git log -1 --format=%B)" == 'trigger game-data promotion' ]]
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          parent_sha="$(git rev-parse HEAD^)"
          [[ "${parent_sha}" == "${main_sha}" ]]
          mapfile -t changed < <(git diff --name-only "${main_sha}" HEAD)
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == '.game-data-promotion-trigger' ]]

      - name: Download sanitized build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: game-database-promotion
          path: .tmp/game-database-promotion-download

      - name: Verify downloaded artifact independently
        shell: bash
        run: |
          set -euo pipefail
          ! find .tmp/game-database-promotion-download -type l -print -quit | grep -q .
          mapfile -t files < <(find .tmp/game-database-promotion-download -type f -printf '%f\n' | sort)
          expected=('game-database-v1.json' 'game-database-v1.sha256')
          [[ "${files[*]}" == "${expected[*]}" ]]
          expected_sha="$(tr -d '\r\n' < .tmp/game-database-promotion-download/game-database-v1.sha256)"
          [[ "${expected_sha}" =~ ^[a-f0-9]{64}$ ]]
          actual_sha="$(sha256sum .tmp/game-database-promotion-download/game-database-v1.json | awk '{print $1}')"
          [[ "${actual_sha}" == "${expected_sha}" ]]
          node scripts/verify-generated-game-database.mjs --artifact

      - name: Promote only the verified public database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data/wuwa
          cp .tmp/game-database-promotion-download/game-database-v1.json public/data/wuwa/game-database-v1.json
          node scripts/verify-generated-game-database.mjs --public
          artifact_sha="$(sha256sum .tmp/game-database-promotion-download/game-database-v1.json | awk '{print $1}')"
          public_sha="$(sha256sum public/data/wuwa/game-database-v1.json | awk '{print $1}')"
          [[ "${artifact_sha}" == "${public_sha}" ]]
          rm .game-data-promotion-trigger
          mapfile -t changed < <(git status --porcelain=v1 -uall | sed -E 's/^.. //' | sort)
          expected=('.game-data-promotion-trigger' 'public/data/wuwa/game-database-v1.json')
          [[ "${changed[*]}" == "${expected[*]}" ]]

      - name: Commit to promotion branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .game-data-promotion-trigger public/data/wuwa/game-database-v1.json
          git diff --cached --check
          git commit -m 'promote verified GameDatabase Release snapshot'
          git push origin "HEAD:${GITHUB_REF_NAME}"
