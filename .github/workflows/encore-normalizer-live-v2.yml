name: Encore normalizer live v2

on:
  push:
    branches:
      - audit/encore-normalizer-live-v2-20260817

permissions:
  contents: read

concurrency:
  group: encore-normalizer-live-v2
  cancel-in-progress: false

jobs:
  normalize:
    name: Import and normalize Encore Release safely
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify npm registry signatures and provenance
        run: npm audit signatures

      - name: Run importer and normalizer attack tests
        run: |
          npm run game-data:test-security
          npm run game-data:test-normalizer-security

      - name: Import live Encore Release into ephemeral workspace
        run: npm run game-data:import

      - name: Inspect fractional weapon growth indexes without source text
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import path from 'node:path';
          const root = path.join(process.cwd(), 'data', 'sources', 'encore', 'release');
          const manifest = JSON.parse(await readFile(path.join(root, 'manifest.json'), 'utf8'));
          const counts = new Map();
          let total = 0;
          let fractional = 0;
          let affectedWeapons = 0;
          for (const entity of manifest.resources.weapons.entities) {
            const detail = JSON.parse(await readFile(path.join(root, 'weapons', 'details', entity.detailFile), 'utf8'));
            let affected = false;
            for (const property of detail.Properties ?? []) {
              for (const growth of property?.GrowthValues ?? []) {
                const value = growth?.Level ?? growth?.level;
                if (typeof value !== 'number' || !Number.isFinite(value)) continue;
                total += 1;
                if (!Number.isInteger(value)) {
                  fractional += 1;
                  affected = true;
                  counts.set(String(value), (counts.get(String(value)) ?? 0) + 1);
                }
              }
            }
            if (affected) affectedWeapons += 1;
          }
          console.log(`FRACTIONAL_WEAPON_GROWTH_INDEXES=${JSON.stringify({ total, fractional, affectedWeapons, values: Object.fromEntries([...counts.entries()].sort((a,b) => Number(a[0]) - Number(b[0]))) })}`);
          NODE

      - name: Normalize live RAW snapshot offline
        run: npm run game-data:normalize

      - name: Validate normalized output remains inert
        shell: bash
        run: |
          set -euo pipefail
          file='.tmp/wuwa-game-data-normalized/normalized-source.json'
          test -s "${file}"
          if grep -Eqi 'https?://|<script|javascript:|data:[[:space:]]*text/html|on[a-z]+[[:space:]]*=' "${file}"; then
            echo 'Normalized output contains a forbidden URL/script-like token.' >&2
            exit 1
          fi
          if grep -Eqi '<[^>]{1,512}>' "${file}"; then
            echo 'Normalized output still contains markup-like text.' >&2
            exit 1
          fi
          if grep -Fq '__WUWA_REVIEWED_SOURCE_NAME_MISSING__' "${file}"; then
            echo 'Temporary unnamed-skill sentinel leaked into normalized output.' >&2
            exit 1
          fi

      - name: Summarize normalized structure without remote text
        run: |
          node --input-type=module <<'NODE'
          import { readFile, stat } from 'node:fs/promises';
          const file = '.tmp/wuwa-game-data-normalized/normalized-source.json';
          const data = JSON.parse(await readFile(file, 'utf8'));
          const targetCharacter = data.characters.find((entry) => entry.sourceId === '1305');
          const targetSkill = targetCharacter?.skills?.find((entry) => entry.sourceSkillId === '1002308');
          const unnamedSkills = data.characters.flatMap((character) =>
            (character.skills ?? [])
              .filter((skill) => !Object.prototype.hasOwnProperty.call(skill, 'name'))
              .map((skill) => ({ characterSourceId: character.sourceId, sourceSkillId: skill.sourceSkillId, typePresent: typeof skill.type === 'string' && skill.type.length > 0, descriptionPresent: typeof skill.description === 'string' && skill.description.length > 0 })),
          );
          const hashCounts = Object.fromEntries(
            Object.entries(data.sourceHashes ?? {}).map(([family, entries]) => [family, Object.keys(entries ?? {}).length]),
          );
          const summary = {
            counts: data.counts,
            bytes: (await stat(file)).size,
            diagnosticCodes: (data.diagnostics ?? []).map((entry) => entry.code).sort(),
            unnamedSkills,
            targetSkill1305_1002308: targetSkill ? {
              exists: true,
              hasName: Object.prototype.hasOwnProperty.call(targetSkill, 'name'),
              typePresent: typeof targetSkill.type === 'string' && targetSkill.type.length > 0,
              descriptionPresent: typeof targetSkill.description === 'string' && targetSkill.description.length > 0,
            } : { exists: false },
            hashCounts,
            sonataCount: Array.isArray(data.sonataSets) ? data.sonataSets.length : null,
            sonataLoreFields: (data.sonataSets ?? []).filter((entry) => Object.prototype.hasOwnProperty.call(entry, 'sourceLore')).length,
          };
          console.log(`NORMALIZED_SAFE_SUMMARY=${JSON.stringify(summary)}`);
          NODE

      - name: Upload sanitized normalized preview only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encore-normalized-preview-v2
          path: .tmp/wuwa-game-data-normalized/normalized-source.json
          if-no-files-found: error
          retention-days: 3
