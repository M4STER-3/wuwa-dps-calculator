name: Promote validated WuWa assets

on:
  push:
    branches:
      - "asset-promotion/**"
    paths:
      - ".github/asset-promotion.trigger"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wuwa-asset-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Re-fetch, checkpoint, verify, and prepare asset PR
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Confirm trusted promotion branch boundary
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            asset-promotion/*) ;;
            *)
              echo "Refusing asset promotion from unexpected branch ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          if [ -n "$(git status --porcelain=v1 -uall)" ]; then
            echo 'Checkout must start clean.' >&2
            git status --short -uall >&2
            exit 1
          fi

          git fetch --no-tags origin main
          unexpected_base="$({ git diff --name-only origin/main...HEAD | grep -vE '^\.github/asset-promotion\.trigger$' | grep -vE '^public/assets/wuwa/'; } || true)"
          if [ -n "${unexpected_base}" ]; then
            echo 'Promotion branches may differ from main only by the trigger and checkpointed WuWa assets:' >&2
            printf '%s\n' "${unexpected_base}" >&2
            exit 1
          fi

      - name: Re-run asset policy and hostile-input tests
        run: |
          set -euo pipefail
          node scripts/test-wuwa-asset-sync-policy.mjs
          node scripts/test-wuwa-assets-security.mjs
          node scripts/test-wuwa-asset-verifier.mjs

      - name: Inspect existing promotion checkpoint
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          stage="$({ node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          let manifest;
          try {
            manifest = JSON.parse(await readFile('public/assets/wuwa/manifest.json', 'utf8'));
          } catch (error) {
            if (error && typeof error === 'object' && error.code === 'ENOENT') {
              console.log('none');
              process.exit(0);
            }
            throw error;
          }

          const entities = manifest?.entities;
          if (!entities || typeof entities !== 'object' || Array.isArray(entities)) {
            throw new Error('Existing promotion manifest has no valid entities object.');
          }
          const counts = Object.fromEntries(
            ['characters', 'weapons', 'echoes'].map((category) => {
              const value = entities[category];
              if (!value || typeof value !== 'object' || Array.isArray(value)) {
                throw new Error(`Existing promotion manifest category ${category} is invalid.`);
              }
              return [category, Object.keys(value).length];
            }),
          );

          if (counts.echoes > 0 && (counts.characters === 0 || counts.weapons === 0)) {
            throw new Error('Echo checkpoint exists without all prerequisite categories.');
          }
          if (counts.weapons > 0 && counts.characters === 0) {
            throw new Error('Weapon checkpoint exists without characters.');
          }

          if (counts.echoes > 0) console.log('echoes');
          else if (counts.weapons > 0) console.log('weapons');
          else if (counts.characters > 0) console.log('characters');
          else console.log('none');
          NODE
          } )"
          echo "stage=${stage}" >> "${GITHUB_OUTPUT}"
          echo "Resuming from checkpoint: ${stage}"

      - name: Synchronize characters checkpoint
        if: steps.checkpoint.outputs.stage == 'none'
        run: node scripts/run-safe-wuwa-assets.mjs --force --category=characters --reset-manifest

      - name: Commit characters checkpoint
        if: steps.checkpoint.outputs.stage == 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unexpected="$({ git status --porcelain=v1 -uall | awk '{print $2}' | grep -vE '^public/assets/wuwa/'; } || true)"
          if [ -n "${unexpected}" ]; then
            echo 'Characters checkpoint changed files outside public/assets/wuwa:' >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          git add -A -- public/assets/wuwa
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'checkpoint verified WuWa character assets'
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Synchronize weapons checkpoint
        if: steps.checkpoint.outputs.stage != 'weapons' && steps.checkpoint.outputs.stage != 'echoes'
        run: node scripts/run-safe-wuwa-assets.mjs --force --category=weapons

      - name: Commit weapons checkpoint
        if: steps.checkpoint.outputs.stage != 'weapons' && steps.checkpoint.outputs.stage != 'echoes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unexpected="$({ git status --porcelain=v1 -uall | awk '{print $2}' | grep -vE '^public/assets/wuwa/'; } || true)"
          if [ -n "${unexpected}" ]; then
            echo 'Weapons checkpoint changed files outside public/assets/wuwa:' >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi
          git add -A -- public/assets/wuwa
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'checkpoint verified WuWa weapon assets'
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Synchronize and finalize Echo assets
        if: steps.checkpoint.outputs.stage != 'echoes'
        run: node scripts/run-safe-wuwa-assets.mjs --force --category=echoes --finalize

      - name: Independently verify every final promoted object
        run: node scripts/verify-wuwa-assets.mjs

      - name: Bound GitHub promotion footprint
        shell: bash
        run: |
          set -euo pipefail
          object_count="$(find public/assets/wuwa/objects -maxdepth 1 -type f -printf '.' | wc -c)"
          physical_bytes="$(du -sb public/assets/wuwa/objects | cut -f1)"
          if [ "${object_count}" -gt 5000 ]; then
            echo "Refusing to promote ${object_count} physical objects; cap is 5000." >&2
            exit 1
          fi
          if [ "${physical_bytes}" -gt 268435456 ]; then
            echo "Refusing to promote ${physical_bytes} physical bytes; cap is 256 MiB." >&2
            exit 1
          fi
          echo "Promotion footprint: ${object_count} objects, ${physical_bytes} bytes."

      - name: Restrict final generated changes to the asset tree
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$({ git status --porcelain=v1 -uall | awk '{print $2}' | grep -vE '^public/assets/wuwa/' | grep -vE '^\.github/asset-promotion\.trigger$'; } || true)"
          if [ -n "${unexpected}" ]; then
            echo 'Promotion changed files outside the reviewed asset tree:' >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Remove one-shot trigger and prepare final commit
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/asset-promotion.trigger
          git add -A -- public/assets/wuwa .github/asset-promotion.trigger

          staged="$({ git diff --cached --name-only; } || true)"
          unexpected="$({ printf '%s\n' "${staged}" | grep -vE '^public/assets/wuwa/' | grep -vE '^\.github/asset-promotion\.trigger$'; } || true)"
          if [ -n "${unexpected}" ]; then
            echo 'Refusing to stage files outside the reviewed promotion boundary:' >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

          if git diff --quiet origin/main -- public/assets/wuwa; then
            echo 'asset_changes=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'asset_changes=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit verified final assets to promotion branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'promote verified WuWa assets'
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open asset promotion pull request
        if: steps.prepare.outputs.asset_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh pr view "${GITHUB_REF_NAME}" --json number --jq '.number' >/dev/null 2>&1; then
            echo 'Promotion pull request already exists.'
            exit 0
          fi

          cat >"${RUNNER_TEMP}/asset-promotion-pr.md" <<EOF
          ## Automated validated asset promotion

          This pull request contains only the locally materialized WuWa asset tree generated from Encore.moe Release data.

          The workflow promoted the data through resumable category checkpoints:
          - characters;
          - weapons;
          - Echoes, followed by global finalization and pruning.

          Each completed checkpoint was committed to the promotion branch so a later category failure does not require re-downloading earlier categories. Before the final commit, the workflow independently re-read every generated object and verified MIME signature, byte size, SHA-256, content-addressed path, trusted Encore source URL, required semantic roles, deduplication and orphan-free storage.

          Source workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The promotion never writes directly to main; normal PR validation still runs before merge.
          EOF

          gh pr create \
            --base main \
            --head "${GITHUB_REF_NAME}" \
            --title 'promote verified WuWa assets' \
            --body-file "${RUNNER_TEMP}/asset-promotion-pr.md"

      - name: Report no asset changes
        if: steps.prepare.outputs.asset_changes != 'true'
        run: echo 'Live verification succeeded and the promoted asset tree is already identical to main.'
