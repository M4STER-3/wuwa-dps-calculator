name: Echo source classification audit once

on:
  push:
    branches:
      - audit/echo-source-classification-20260817

permissions:
  contents: read

concurrency:
  group: echo-source-classification-audit-once
  cancel-in-progress: false

jobs:
  audit:
    name: Inspect Echo source classification without publishing RAW
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify npm registry signatures and provenance
        run: npm audit signatures

      - name: Run importer attack tests
        run: npm run game-data:test-security

      - name: Import live Release into ephemeral workspace
        run: npm run game-data:import

      - name: Summarize Echo classification fields only
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import path from 'node:path';

          const root = path.join(process.cwd(), 'data', 'sources', 'encore', 'release');
          const manifest = JSON.parse(await readFile(path.join(root, 'manifest.json'), 'utf8'));
          const distributions = {
            typeDescription: new Map(),
            phantomType: new Map(),
            qualityId: new Map(),
            rarity: new Map(),
            levelUpGroupId: new Map(),
            parentMonsterNonZero: 0,
          };
          const tuples = new Map();
          const typeExamples = new Map();
          const duplicateNames = new Map();

          const bump = (map, value) => {
            const key = value == null ? '<missing>' : String(value);
            map.set(key, (map.get(key) ?? 0) + 1);
          };

          for (const entity of manifest.resources.echoes.entities) {
            const detail = JSON.parse(
              await readFile(path.join(root, 'echoes', 'details', entity.detailFile), 'utf8'),
            );
            const typeDescription = typeof detail.TypeDescription === 'string' ? detail.TypeDescription.trim() : null;
            bump(distributions.typeDescription, typeDescription);
            bump(distributions.phantomType, detail.PhantomType);
            bump(distributions.qualityId, detail.QualityId);
            bump(distributions.rarity, detail.Rarity);
            bump(distributions.levelUpGroupId, detail.LevelUpGroupId);
            if (typeof detail.ParentMonsterId === 'number' && detail.ParentMonsterId !== 0) {
              distributions.parentMonsterNonZero += 1;
            }

            const tupleKey = JSON.stringify({
              typeDescription,
              phantomType: detail.PhantomType ?? null,
              qualityId: detail.QualityId ?? null,
              rarity: detail.Rarity ?? null,
              levelUpGroupId: detail.LevelUpGroupId ?? null,
              parentMonsterNonZero:
                typeof detail.ParentMonsterId === 'number' && detail.ParentMonsterId !== 0,
            });
            tuples.set(tupleKey, (tuples.get(tupleKey) ?? 0) + 1);

            const name = typeof detail.MonsterName === 'string' ? detail.MonsterName.trim() : '';
            if (name) {
              const arr = duplicateNames.get(name) ?? [];
              arr.push({
                sourceId: String(entity.sourceId),
                typeDescription,
                phantomType: detail.PhantomType ?? null,
                qualityId: detail.QualityId ?? null,
                rarity: detail.Rarity ?? null,
                levelUpGroupId: detail.LevelUpGroupId ?? null,
                parentMonsterNonZero:
                  typeof detail.ParentMonsterId === 'number' && detail.ParentMonsterId !== 0,
              });
              duplicateNames.set(name, arr);
            }

            if (typeDescription) {
              const examples = typeExamples.get(typeDescription) ?? [];
              if (examples.length < 8) {
                examples.push({
                  sourceId: String(entity.sourceId),
                  name: name.slice(0, 120),
                  phantomType: detail.PhantomType ?? null,
                  qualityId: detail.QualityId ?? null,
                  rarity: detail.Rarity ?? null,
                  levelUpGroupId: detail.LevelUpGroupId ?? null,
                  parentMonsterNonZero:
                    typeof detail.ParentMonsterId === 'number' && detail.ParentMonsterId !== 0,
                });
              }
              typeExamples.set(typeDescription, examples);
            }
          }

          const duplicateSummary = [...duplicateNames.entries()]
            .filter(([, entries]) => entries.length > 1)
            .map(([name, entries]) => ({ name: name.slice(0, 120), entries }))
            .sort((a, b) => a.name.localeCompare(b.name));

          const mapObject = (map) => Object.fromEntries([...map.entries()].sort((a, b) => a[0].localeCompare(b[0])));
          const summary = {
            total: manifest.resources.echoes.entities.length,
            distributions: {
              typeDescription: mapObject(distributions.typeDescription),
              phantomType: mapObject(distributions.phantomType),
              qualityId: mapObject(distributions.qualityId),
              rarity: mapObject(distributions.rarity),
              levelUpGroupId: mapObject(distributions.levelUpGroupId),
              parentMonsterNonZero: distributions.parentMonsterNonZero,
            },
            tuples: [...tuples.entries()]
              .map(([tuple, count]) => ({ fields: JSON.parse(tuple), count }))
              .sort((a, b) => b.count - a.count),
            typeExamples: Object.fromEntries([...typeExamples.entries()].sort((a, b) => a[0].localeCompare(b[0]))),
            duplicateNameGroupCount: duplicateSummary.length,
            duplicateNames: duplicateSummary,
          };
          console.log(`ECHO_CLASSIFICATION_AUDIT=${JSON.stringify(summary)}`);
          NODE
