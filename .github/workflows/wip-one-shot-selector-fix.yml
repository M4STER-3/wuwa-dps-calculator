name: WIP one-shot selector semantics patch

on:
  push:
    branches:
      - v4-ui-step-11-dps4

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'M4STER-3/wuwa-dps-calculator' && github.ref == 'refs/heads/v4-ui-step-11-dps4'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v4-ui-step-11-dps4
          fetch-depth: 1
          persist-credentials: true
      - name: Apply bounded selector patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/domain/personal-combat-simulation.ts')
          text = path.read_text(encoding='utf-8')
          old = '  if (actual === undefined) return "unsupported";'
          new = '  if (actual === undefined) return "ignored";'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one selector guard, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/wip-one-shot-selector-fix.yml
          git config user.name "WUWA LAB automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/domain/personal-combat-simulation.ts
          git diff --cached --check
          git commit -m "Treat absent runtime selector dimensions as non-matching"
          git push origin HEAD:v4-ui-step-11-dps4
